name: Build pk3DS FTG v7

on:
  push:
    branches:
      - pk3ds-ftg-v7-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout pinned pk3DS source
        shell: pwsh
        run: |
          git clone https://github.com/adhfult/pk3DS-but-mostly-for-USUM.git src
          Set-Location src
          git checkout 59298452d1a61d96b01a4ca99ce7900628f24a0d
          Set-Location ..

      - name: Patch FTG v7 behavior
        shell: pwsh
        run: python build/pk3ds/patch_pk3ds_ftg_v7.py

      - name: Work around release-only resources absent from source repo
        shell: pwsh
        run: |
          # These assets ship in the v6 release the user supplied, but are not checked into the
          # pinned source tree. Compile without embedding them; the final FTG package is merged
          # over v6 so its Resources folder remains intact.
          $core = 'src/pk3DS.Core/pk3DS.Core.csproj'
          $wf = 'src/pk3DS.WinForms/pk3DS.WinForms.csproj'
          $coreText = Get-Content $core -Raw
          $coreText = $coreText.Replace('    <EmbeddedResource Include="Resources\code_map.csv" />' + [Environment]::NewLine, '')
          Set-Content $core -Value $coreText -NoNewline
          $wfText = Get-Content $wf -Raw
          $wfText = $wfText.Replace('    <EmbeddedResource Include="Resources\code_map.csv" />' + [Environment]::NewLine, '')
          $wfText = $wfText.Replace('    <EmbeddedResource Include="Resources\randsettings.txt" />' + [Environment]::NewLine, '')
          Set-Content $wf -Value $wfText -NoNewline

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Release
        shell: pwsh
        run: dotnet build src/pk3DS.sln --configuration Release

      - name: Package FTG v7 binaries
        shell: pwsh
        run: |
          $out = 'src/pk3DS.WinForms/bin/Release/net8.0-windows'
          if (!(Test-Path $out)) { throw "Build output not found: $out" }
          Compress-Archive -Path "$out/*" -DestinationPath 'pk3DS-for-USUM-v7-FTG-binaries.zip' -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pk3DS-for-USUM-v7-FTG-binaries
          path: pk3DS-for-USUM-v7-FTG-binaries.zip
          if-no-files-found: error
          retention-days: 7
