name: Build pk3DS FTG v7

on:
  push:
    branches:
      - pk3ds-ftg-v7-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout pinned pk3DS source
        shell: pwsh
        run: |
          git clone https://github.com/adhfult/pk3DS-but-mostly-for-USUM.git src
          Set-Location src
          git checkout 59298452d1a61d96b01a4ca99ce7900628f24a0d
          Set-Location ..

      - name: Patch FTG v7 behavior
        shell: pwsh
        run: python build/pk3ds/patch_pk3ds_ftg_v7.py

      - name: Work around release-only resources absent from source repo
        shell: pwsh
        run: |
          # The pinned source references code_map.csv as an embedded resource, but that release
          # asset is not checked into GitHub. FTG's final package is merged over the user's v6
          # release, which already contains Resources/code_map.csv, so compile without embedding it.
          $core = 'src/pk3DS.Core/pk3DS.Core.csproj'
          $wf = 'src/pk3DS.WinForms/pk3DS.WinForms.csproj'
          (Get-Content $core -Raw).Replace('    <EmbeddedResource Include="Resources\code_map.csv" />' + [Environment]::NewLine, '') | Set-Content $core -NoNewline
          (Get-Content $wf -Raw).Replace('    <EmbeddedResource Include="Resources\code_map.csv" />' + [Environment]::NewLine, '') | Set-Content $wf -NoNewline

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Release
        shell: pwsh
        run: dotnet build src/pk3DS.sln --configuration Release

      - name: Package FTG v7 binaries
        shell: pwsh
        run: |
          $out = 'src/pk3DS.WinForms/bin/Release/net8.0-windows'
          if (!(Test-Path $out)) { throw "Build output not found: $out" }
          Compress-Archive -Path "$out/*" -DestinationPath 'pk3DS-for-USUM-v7-FTG-binaries.zip' -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pk3DS-for-USUM-v7-FTG-binaries
          path: pk3DS-for-USUM-v7-FTG-binaries.zip
          if-no-files-found: error
          retention-days: 7
